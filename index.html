<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="mode-controls">
        <button class="mode-btn" onclick="setTimer(1500)">Focus</button>
        <button class="mode-btn" onclick="setTimer(300)">Short</button>
        <button class="mode-btn" onclick="setTimer(900)">Long</button>
    </div>

    <div id="timer">
        <div class="box" id="minDisplay">25</div>
        <div style="align-self: center;">:</div>
        <div class="box" id="secDisplay">00</div>
    </div>

    <div class="icon-controls">
        <button class="icon-btn" onclick="toggleTimer()" id="startBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="icon-btn" onclick="stopTimer()">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button class="icon-btn" onclick="resetTimer()">
            <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
